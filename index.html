<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./Icono/Pokeball.png">
    <link rel="stylesheet" href="./style.css">
    <title>Pokedex</title>
</head>
<body>

    <h1>PokeDex</h1>
    <div id="controles">

        <input type="text" id="filtroNombre" placeholder="Buscar por nombre">

        <select id="filtroTipo">
            <option value="todos">Todos los tipos</option>
        </select>

        <select id="filtroAltura">
            <option value="todas">Cualquier altura</option>
            <option value="baja">Baja (menos de 1 m)</option>
            <option value="media">Media (1 m a menos de 2 m)</option>
            <option value="alta">Alta (2 m o más)</option>
        </select>

        <select id="filtroPeso">
            <option value="todos">Cualquier peso</option>
            <option value="liviano">Liviano (menos de 10 kg)</option>
            <option value="medio">Medio (10 kg a menos de 50 kg)</option>
            <option value="pesado">Pesado (50 kg o más)</option>
        </select>

        <select id="ordenCriterio">
            <option value="id">Ordenar por número</option>
            <option value="name">Ordenar por nombre</option>
            <option value="height">Ordenar por altura</option>
            <option value="weight">Ordenar por peso</option>
        </select>

        <select id="ordenDireccion">
            <option value="asc">Ascendente</option>
            <option value="desc">Descendente</option>
        </select>

        <button id="btnLimpiar">Limpiar filtros</button>
    </div>

    <!-- JS dibuja las cards de los Pokémon -->
    <div id="pokemon-container"></div>

    <script src="./script.js"></script>
</body>
</html>
